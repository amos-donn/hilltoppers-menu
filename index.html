      <script>
      // This repo's own menu.json is refreshed by .github/workflows/update-menu.yml
      // on a short schedule, so it is read first: it is same-origin (no CORS
      // concerns) and usually the freshest. The reference project's published
      // feed is the fallback.
      const MENU_URLS = [
        './menu.json',
        'https://hilltoppers.pages.dev/menu.json'
      ];
      // The widget is meant to show new data almost immediately, so it polls
      // often and also refreshes the moment the tab regains focus. Polling
      // revalidates instead of downloading, so a poll with nothing new costs a
      // 304 rather than the whole file.
      const MENU_POLL_MS = 15 * 1000;
      const RATINGS_POLL_MS = 20 * 1000;

      // Ratings backend (see worker/). Leave empty to fall back to ratings
      // stored in this browser only; set it to the deployed Worker URL to share
      // ratings between everyone.
      const RATINGS_API = 'https://hilltoppers-menu-ratings.amos-donn.workers.dev';
      const RATER_ID_KEY = 'hilltoppers-rater-id';
      const LOCAL_RATINGS_KEY = 'hilltoppers-ratings-v1';

      // The original source of the menu. The source site has no per-dish URL,
      // so an item links to the day it was served on, on that site.
      const SOURCE_MENU_BASE = 'https://menus.campus-dining.com/eliorna/d0358';
      const SCHOOL_TZ = 'America/New_York';

      // Four sections that are the same every day. The daily feed only carries
      // Global Fare and Classic Kitchen, so these are listed here rather than
      // read from it — hence "static" in the note shown above them.
      //
      // Order is the visual order: the grid fills row by row, so the first two
      // are the top row and the last two the bottom.
      const STATIC_SECTIONS = [
        { key: 'Soupside', items: ['Daily Soup'] },
        { key: 'Sauce + Stone', items: ['Pepperoni Pizza', 'Cheese Pizza', 'Variety Pizza'] },
        { key: 'Greens', items: ['Salad'] },
        { key: 'Sandwich', items: ['Sandwich'] }
      ];

      const STAR_SVG = '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M12 2.6l2.9 6 6.5.9-4.7 4.5 1.1 6.5L12 17.4l-5.8 3.1 1.1-6.5L2.6 9.5l6.5-.9z"/></svg>';

      let menuData = null;
      let availableDates = [];
      let selectedDate = null;
      let selectedPeriod = 'Breakfast';
      let periodPinnedByUser = false;
      let lastFetchTime = null;
      let renderedKey = null;
      let menuTimer = null;
      let ratingsTimer = null;
      let ratingsBusy = false;
      // Latest known aggregate per dish, so the dialog can preload your rating.
      const ratingsById = new Map();

      const menuDisplay = document.getElementById('menuDisplay');
      const dayPickerEl = document.getElementById('dayPicker');
      const refreshInfoEl = document.getElementById('refreshInfo');
      const sourceLinkEl = document.getElementById('sourceLink');
      const ratingDialog = document.getElementById('ratingDialog');
      const ratingDialogForm = document.getElementById('ratingDialogForm');
      const ratingDialogDish = document.getElementById('ratingDialogDish');
      const ratingDialogStars = document.getElementById('ratingDialogStars');
      const ratingDialogHint = document.getElementById('ratingDialogHint');
      const ratingDialogSave = document.getElementById('ratingDialogSave');
      const ratingDialogCancel = document.getElementById('ratingDialogCancel');
      const ratingDialogDelete = document.getElementById('ratingDialogDelete');

      function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
      }

      function escapeAttr(str) {
        return escapeHtml(str).replace(/"/g, '&quot;').replace(/'/g, '&#39;');
      }

      function dishId(name) {
        return String(name).trim().toLowerCase().replace(/\s+/g, ' ');
      }

      function normalizeItems(value) {
        if (!Array.isArray(value)) return [];
        const seen = new Set();
        const items = [];
        for (const item of value) {
          if (typeof item !== 'string') continue;
          const trimmed = item.trim();
          if (!trimmed) continue;
          const key = dishId(trimmed);
          if (!seen.has(key)) {
            seen.add(key);
            items.push(trimmed);
          }
        }
        return items;
      }

      function listDates(data) {
        if (!data || !data.days || typeof data.days !== 'object') return [];
        const keys = Object.keys(data.days).filter((key) => /^\d{4}-\d{2}-\d{2}$/.test(key));
        return keys.sort();
      }

      function todayKey() {
        return new Intl.DateTimeFormat('en-CA', {
          timeZone: SCHOOL_TZ,
          year: 'numeric',
          month: '2-digit',
          day: '2-digit'
        }).format(new Date());
      }

      function schoolMinutesNow() {
        const parts = new Intl.DateTimeFormat('en-US', {
          timeZone: SCHOOL_TZ,
          hour: '2-digit',
          minute: '2-digit',
          hourCycle: 'h23'
        }).formatToParts(new Date());
        const value = (type) => Number(parts.find((part) => part.type === type)?.value ?? 0);
        return value('hour') * 60 + value('minute');
      }

      // The source posts breakfast, lunch and dinner under the same date, so on
      // open we pick the period that matches the school clock rather than always
      // starting at breakfast. The reference extension does the same, switching
      // to dinner at 2 PM when it has no schedule to read a lunch end from.
      function defaultPeriodForNow() {
        const minutes = schoolMinutesNow();
        if (minutes < 10 * 60) return 'Breakfast';
        if (minutes < 14 * 60) return 'Lunch';
        return 'Dinner';
      }

      function formatDateLabel(ymd) {
        const date = new Date(`${ymd}T12:00:00Z`);
        return new Intl.DateTimeFormat('en-US', {
          weekday: 'short',
          month: 'short',
          day: 'numeric'
        }).format(date);
      }

      function sourceDayUrl(ymd) {
        return `${SOURCE_MENU_BASE}?mldate=${encodeURIComponent(ymd)}`;
      }

      function updateRefreshInfo() {
        if (!lastFetchTime) {
          refreshInfoEl.textContent = '';
          return;
        }
        const minutes = Math.floor((Date.now() - lastFetchTime) / 60000);
        if (minutes < 1) {
          refreshInfoEl.textContent = 'Just updated';
        } else if (minutes < 60) {
          refreshInfoEl.textContent = `Updated ${minutes}m ago`;
        } else {
          refreshInfoEl.textContent = `Updated ${Math.floor(minutes / 60)}h ago`;
        }
      }

      /* ---------- ratings ---------- */

      function getRaterId() {
        let id = null;
        try {
          id = localStorage.getItem(RATER_ID_KEY);
        } catch (_) {
          // Private mode can block storage; a per-load id still works.
        }
        if (!id) {
          id = (crypto && crypto.randomUUID)
            ? crypto.randomUUID()
            : `r-${Date.now()}-${Math.random().toString(36).slice(2)}`;
          try {
            localStorage.setItem(RATER_ID_KEY, id);
          } catch (_) {
            // Ignore: ratings then do not survive a reload in this browser.
          }
        }
        return id;
      }

      const RATER_ID = getRaterId();

      function readLocalRatings() {
        try {
          const raw = localStorage.getItem(LOCAL_RATINGS_KEY);
          const parsed = raw ? JSON.parse(raw) : null;
          return parsed && typeof parsed === 'object' ? parsed : {};
        } catch (_) {
          return {};
        }
      }

      function writeLocalRatings(all) {
        try {
          localStorage.setItem(LOCAL_RATINGS_KEY, JSON.stringify(all));
        } catch (_) {
          // Ignore: the rating still shows for this session.
        }
      }

      function localEntry(id) {
        const mine = readLocalRatings()[id];
        return mine ? { count: 1, average: mine, myRating: mine } : null;
      }

      async function fetchSharedRatings(ids) {
        if (!RATINGS_API || !ids.length) return null;
        try {
          const url = `${RATINGS_API}/api/ratings?dishes=${encodeURIComponent(ids.join(','))}`;
          const response = await fetch(url, {
            cache: 'no-store',
            headers: { 'X-Rater-ID': RATER_ID }
          });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const data = await response.json();
          return data && data.ratings ? data.ratings : {};
        } catch (_) {
          return null;
        }
      }

      function paintRating(el, entry) {
        const stars = Array.from(el.querySelectorAll('.star'));
        const average = entry && entry.count ? Number(entry.average) : 0;
        const count = entry && entry.count ? Number(entry.count) : 0;
        const mine = entry && entry.myRating ? Number(entry.myRating) : 0;
        const filled = Math.round(average);

        ratingsById.set(el.dataset.dishId, entry || null);

        stars.forEach((star) => {
          star.classList.toggle('filled', Number(star.dataset.value) <= filled);
        });

        const summary = el.querySelector('.rating-summary');
        if (!count) {
          summary.textContent = 'No ratings yet';
        } else {
          summary.textContent = `${average.toFixed(1)} (${count})${mine ? ` · you ${mine}` : ''}`;
        }
      }

      function ratingNodes() {
        return Array.from(menuDisplay.querySelectorAll('.dish-rating'));
      }

      async function refreshRatings() {
        const nodes = ratingNodes();
        if (!nodes.length) return;
        const ids = nodes.map((node) => node.dataset.dishId);
        const shared = await fetchSharedRatings(ids);
        nodes.forEach((node) => {
          const id = node.dataset.dishId;
          paintRating(node, shared ? (shared[id] || null) : localEntry(id));
        });
      }

      async function submitRating(id, value) {
        if (RATINGS_API) {
          try {
            const response = await fetch(`${RATINGS_API}/api/ratings`, {
              method: 'POST',
              cache: 'no-store',
              headers: { 'Content-Type': 'application/json', 'X-Rater-ID': RATER_ID },
              body: JSON.stringify({ dish: id, rating: value })
            });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const data = await response.json();
            return data && data.rating ? data.rating : null;
          } catch (_) {
            // Fall through to the local rating so a click is never lost.
          }
        }
        const all = readLocalRatings();
        all[id] = value;
        writeLocalRatings(all);
        return { count: 1, average: value, myRating: value };
      }

      // Deleting is a removal, so a failed request must not look like success.
      // Returns the updated aggregate, or null when nothing was removed.
      async function clearRating(id) {
        if (RATINGS_API) {
          const response = await fetch(`${RATINGS_API}/api/ratings`, {
            method: 'DELETE',
            cache: 'no-store',
            headers: { 'Content-Type': 'application/json', 'X-Rater-ID': RATER_ID },
            body: JSON.stringify({ dish: id })
          });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const data = await response.json();
          return data && data.rating ? data.rating : null;
        }
        const all = readLocalRatings();
        delete all[id];
        writeLocalRatings(all);
        return { count: 0, average: 0, myRating: null };
      }

      async function catalogDishes() {
        if (!RATINGS_API || !menuData) return;
        const day = menuData.days ? menuData.days[selectedDate] : null;
        if (!day) return;
        // Grouped by station so the dashboard can break ratings down per side,
        // and by meal period so it can also answer "what did people think of
        // breakfast". A dish on both stations, or served at two meals, is sent
        // under each.
        const stations = {};
        const periods = {};
        const seen = new Set();
        ['breakfast', 'lunch', 'dinner'].forEach((period) => {
          const entry = day[period];
          if (!entry) return;
          [['Global Fare', 'globalFare'], ['Classic Kitchen', 'classicKitchen']].forEach(
            ([label, key]) => {
              normalizeItems(entry[key]).forEach((item) => {
                const id = dishId(item);
                if (!id) return;
                (periods[period] = periods[period] || []).push(item);
                if (seen.has(id)) return;
                seen.add(id);
                (stations[label] = stations[label] || []).push(item);
              });
            }
          );
        });
        // The static sections are the same every day, so cataloguing them on
        // each day is what gives the dashboard a history to chart.
        STATIC_SECTIONS.forEach((section) => {
          section.items.forEach((item) => {
            const id = dishId(item);
            if (!id || seen.has(id)) return;
            seen.add(id);
            (stations[section.key] = stations[section.key] || []).push(item);
          });
        });
        const dishes = Object.values(stations).flat();
        if (!dishes.length) return;
        try {
          await fetch(`${RATINGS_API}/api/dishes/catalog`, {
            method: 'POST',
            cache: 'no-store',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ date: selectedDate, dishes, stations, periods })
          });
        } catch (_) {
          // Cataloguing is best effort; rating still works without it.
        }
      }

      /* ---------- rating dialog ---------- */

      // What the dialog is currently editing. `preview` follows the pointer or
      // keyboard focus so hovering star 3 shows 3.0 before anything is saved.
      const dialogState = { dishId: null, dishName: '', value: 0, preview: 0 };

      // Focusing a star on open must not read as a hover preview, or an
      // unrated dish would appear to have one star already picked.
      let focusPreviewArmed = true;

      function dialogStars() {
        return Array.from(ratingDialogStars.querySelectorAll('.rating-dialog-star'));
      }

      function renderDialogStars() {
        const shown = dialogState.preview || dialogState.value;
        dialogStars().forEach((star) => {
          const value = Number(star.dataset.value);
          star.classList.toggle('active', value <= shown);
          star.setAttribute('aria-checked', String(value === dialogState.value));
        });
      }

      function updateDialogHint() {
        if (!dialogState.preview && !dialogState.value) {
          ratingDialogHint.textContent = 'Pick a star rating.';
          return;
        }
        const value = dialogState.preview || dialogState.value;
        ratingDialogHint.textContent = `${value.toFixed(1)} out of 5`;
      }

      function setDialogPreview(value) {
        dialogState.preview = value;
        renderDialogStars();
        updateDialogHint();
      }

      function setDialogValue(value) {
        dialogState.value = value;
        dialogState.preview = 0;
        ratingDialogSave.disabled = !value;
        renderDialogStars();
        updateDialogHint();
      }

      function openRatingDialog(id, name) {
        const entry = ratingsById.get(id) || null;
        dialogState.dishId = id;
        dialogState.dishName = name;
        dialogState.value = entry && entry.myRating ? Number(entry.myRating) : 0;
        dialogState.preview = 0;
        ratingDialogDish.textContent = name;
        ratingDialogSave.disabled = !dialogState.value;
        // Nothing to delete unless this rater already has a rating here.
        ratingDialogDelete.hidden = !dialogState.value;
        ratingDialogDelete.disabled = false;
        renderDialogStars();
        updateDialogHint();
        // showModal autofocuses the first star, and the explicit focus below is
        // a focus too; neither is a hover preview, so ignore focus events while
        // the dialog settles, then re-arm.
        focusPreviewArmed = false;
        if (!ratingDialog.open) ratingDialog.showModal();
        // Focus the current rating if there is one, so keyboard users can
        // adjust it, otherwise the first star.
        const focusValue = dialogState.value || 1;
        const focusStar = ratingDialogStars.querySelector(`.rating-dialog-star[data-value="${focusValue}"]`);
        if (focusStar) focusStar.focus();
        focusPreviewArmed = true;
      }

      function closeRatingDialog() {
        if (ratingDialog.open) ratingDialog.close();
        dialogState.dishId = null;
        dialogState.value = 0;
        dialogState.preview = 0;
      }

      // Build the dialog's stars once.
      ratingDialogStars.innerHTML = [1, 2, 3, 4, 5].map((value) => `
        <button type="button" class="rating-dialog-star" data-value="${value}" role="radio" aria-checked="false" aria-label="${value} star${value > 1 ? 's' : ''}">${STAR_SVG}</button>
      `).join('');

      ratingDialogStars.addEventListener('pointerover', (event) => {
        const star = event.target.closest('.rating-dialog-star');
        if (star) setDialogPreview(Number(star.dataset.value));
      });
      ratingDialogStars.addEventListener('pointerleave', () => setDialogPreview(0));
      ratingDialogStars.addEventListener('focusin', (event) => {
        if (!focusPreviewArmed) { focusPreviewArmed = true; return; }
        const star = event.target.closest('.rating-dialog-star');
        if (star) setDialogPreview(Number(star.dataset.value));
      });
      ratingDialogStars.addEventListener('focusout', () => setDialogPreview(0));
      ratingDialogStars.addEventListener('click', (event) => {
        const star = event.target.closest('.rating-dialog-star');
        if (star) setDialogValue(Number(star.dataset.value));
      });

      // The dialog's own close button (Escape also closes it) is a dismissal.
      ratingDialogCancel.addEventListener('click', closeRatingDialog);
      // Clicking the backdrop — anywhere outside the form — also dismisses.
      ratingDialog.addEventListener('click', (event) => {
        if (event.target === ratingDialog) closeRatingDialog();
      });
      ratingDialog.addEventListener('close', () => {
        dialogState.dishId = null;
        dialogState.value = 0;
        dialogState.preview = 0;
      });

      // Clearing removes your rating for the dish outright; the row falls back
      // to the raw community average, or to "No ratings yet" if you were the
      // last one. A failure leaves the dialog open rather than pretending.
      ratingDialogDelete.addEventListener('click', async () => {
        if (!dialogState.dishId || !dialogState.value) return;
        const id = dialogState.dishId;
        const name = dialogState.dishName;
        ratingDialogDelete.disabled = true;
        ratingDialogSave.disabled = true;
        try {
          const entry = await clearRating(id);
          closeRatingDialog();
          ratingsById.set(id, entry);
          const node = menuDisplay.querySelector(`.dish-rating[data-dish-id="${CSS.escape(id)}"]`);
          if (node) paintRating(node, entry);
          else console.debug('Cleared a rating for a dish no longer on screen:', name);
        } catch (_) {
          ratingDialogHint.textContent = 'Could not remove your rating. Try again.';
          ratingDialogDelete.disabled = false;
          ratingDialogSave.disabled = !dialogState.value;
        }
      });

      ratingDialogForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        if (!dialogState.dishId || !dialogState.value) return;
        const id = dialogState.dishId;
        const value = dialogState.value;
        const name = dialogState.dishName;
        ratingDialogSave.disabled = true;
        const entry = await submitRating(id, value);
        closeRatingDialog();
        if (entry) {
          ratingsById.set(id, entry);
          const node = menuDisplay.querySelector(`.dish-rating[data-dish-id="${CSS.escape(id)}"]`);
          if (node) paintRating(node, entry);
          else console.debug('Rated a dish that is no longer on screen:', name);
        }
      });

      // Opening the dialog: the whole rating row is the button.
      menuDisplay.addEventListener('click', (event) => {
        const row = event.target.closest('.dish-rating');
        if (!row || !menuDisplay.contains(row)) return;
        const id = row.dataset.dishId;
        if (!id) return;
        const nameEl = row.closest('.dining-item')?.querySelector('.dining-item-name');
        openRatingDialog(id, nameEl ? nameEl.textContent : id);
      });

      /* ---------- rendering ---------- */

      function renderDayPicker() {
        if (availableDates.length <= 1) {
          dayPickerEl.innerHTML = '';
          return;
        }

        const idx = availableDates.indexOf(selectedDate);
        const prevDisabled = idx <= 0;
        const nextDisabled = idx >= availableDates.length - 1;

        dayPickerEl.innerHTML = `
          <button class="menu-day-step" type="button" aria-label="Previous day" ${prevDisabled ? 'disabled' : ''} data-step="-1">‹</button>
          <span class="menu-day-label">${escapeHtml(formatDateLabel(selectedDate))}</span>
          <button class="menu-day-step" type="button" aria-label="Next day" ${nextDisabled ? 'disabled' : ''} data-step="1">›</button>
        `;

        dayPickerEl.querySelectorAll('[data-step]').forEach((button) => {
          button.addEventListener('click', () => {
            if (button.disabled) return;
            const step = Number(button.getAttribute('data-step'));
            const nextIndex = idx + step;
            if (nextIndex < 0 || nextIndex >= availableDates.length) return;
            selectedDate = availableDates[nextIndex];
            periodPinnedByUser = false;
            renderMenu({ allowPeriodFallback: true });
            catalogDishes();
            refreshRatings();
          });
        });
      }

      function renderItem(name, url) {
        const id = dishId(name);
        const stars = [1, 2, 3, 4, 5].map((value) => `
          <span class="star" data-value="${value}" aria-hidden="true">${STAR_SVG}</span>
        `).join('');
        // Static sections have no page of their own on the source site, so they
        // get a plain name rather than a link to a day that does not list them.
        const label = url
          ? `<a class="dining-item-name" href="${escapeAttr(url)}" target="_blank" rel="noreferrer noopener">${escapeHtml(name)}</a>`
          : `<span class="dining-item-name">${escapeHtml(name)}</span>`;
        return `
          <div class="dining-item">
            ${label}
            <button type="button" class="dish-rating" data-dish-id="${escapeAttr(id)}" aria-haspopup="dialog" aria-label="Rate ${escapeAttr(name)}">
              <span class="stars" aria-hidden="true">${stars}</span>
              <span class="rating-summary">No ratings yet</span>
            </button>
          </div>
        `;
      }

      function renderStation(name, items, url) {
        return `
          <article class="dining-column">
            <p class="dining-station">${escapeHtml(name)}</p>
            ${items.length
              ? items.map((item) => renderItem(item, url)).join('')
              : '<p class="dining-item">No item found</p>'}
          </article>
        `;
      }

      function syncPeriodTabs() {
        document.querySelectorAll('.dining-tab').forEach((tab) => {
          const isActive = tab.dataset.period === selectedPeriod;
          tab.classList.toggle('active', isActive);
          tab.setAttribute('aria-selected', String(isActive));
        });
      }

      // A period the source has not posted yet has no stations and no dishes,
      // so nothing is ratable. Prefer the first period that does have items.
      function firstPopulatedPeriod(dayData) {
        for (const period of ['breakfast', 'lunch', 'dinner']) {
          const entry = dayData?.[period];
          if (!entry) continue;
          const hasItems = normalizeItems(entry.globalFare).length > 0
            || normalizeItems(entry.classicKitchen).length > 0;
          if (hasItems) return period;
        }
        return null;
      }

      function renderMenu({ allowPeriodFallback = false } = {}) {
        if (!menuData || !selectedDate) {
          menuDisplay.innerHTML = '<p class="dining-loading"><span class="dining-spinner"></span><span>Loading…</span></p>';
          return;
        }

        const dayData = menuData.days?.[selectedDate] ?? menuData.menus;
        if (!dayData) {
          menuDisplay.innerHTML = '<p class="dining-error"><svg class="dining-error-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/><path d="M8 8l8 8M16 8l-8 8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>No menu for this date</span></p>';
          return;
        }

        let entry = dayData[selectedPeriod.toLowerCase()] ?? dayData[selectedPeriod];
        let globalFare = entry ? normalizeItems(entry.globalFare) : [];
        let classicKitchen = entry ? normalizeItems(entry.classicKitchen) : [];

        if (allowPeriodFallback && (!entry || (globalFare.length === 0 && classicKitchen.length === 0))) {
          const fallback = firstPopulatedPeriod(dayData);
          if (fallback && fallback !== selectedPeriod.toLowerCase()) {
            selectedPeriod = fallback.charAt(0).toUpperCase() + fallback.slice(1);
            syncPeriodTabs();
            entry = dayData[fallback];
            globalFare = normalizeItems(entry.globalFare);
            classicKitchen = normalizeItems(entry.classicKitchen);
          }
        }

        if (!entry) {
          menuDisplay.innerHTML = '<p class="dining-error"><svg class="dining-error-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/><path d="M8 8l8 8M16 8l-8 8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>Nothing\'s being served today.</span></p>';
          return;
        }

        if (globalFare.length === 0 && classicKitchen.length === 0) {
          menuDisplay.innerHTML = '<p class="dining-error"><svg class="dining-error-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/><path d="M8 8l8 8M16 8l-8 8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>Nothing\'s being served today.</span></p>';
          return;
        }

        const url = sourceDayUrl(selectedDate);
        menuDisplay.innerHTML = `
          <div class="dining-grid">
            ${renderStation('Global Fare', globalFare, url)}
            ${renderStation('Classic Kitchen', classicKitchen, url)}
          </div>
          <div class="dining-divider"><span class="dining-divider-label">Always available</span></div>
          <p class="dining-note">These foods are static — they don't change day-to-day.</p>
          <div class="dining-grid dining-grid-static">
            ${STATIC_SECTIONS.map((section) => renderStation(section.key, section.items, null)).join('')}
          </div>
        `;

        sourceLinkEl.href = url;
        renderDayPicker();
        updateRefreshInfo();
        renderedKey = `${selectedDate}|${selectedPeriod}|${menuData.updatedAt || ''}`;
      }

      /* ---------- data loading ---------- */

      async function fetchMenuData() {
        let lastError = null;
        for (const base of MENU_URLS) {
          try {
            const response = await fetch(base, { cache: 'no-cache' });
            // 304 means the copy already held is current; nothing to redraw.
            if (response.status === 304) {
              if (menuData) return menuData;
              throw new Error('not modified without a cached menu');
            }
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const data = await response.json();
            if (!data || !data.days) throw new Error('missing days');
            return data;
          } catch (error) {
            lastError = error;
          }
        }
        throw lastError || new Error('no menu source');
      }

      async function loadMenu() {
        try {
          const data = await fetchMenuData();
          menuData = data;
          lastFetchTime = Date.now();
          availableDates = listDates(menuData);

          if (!availableDates.length) {
            menuDisplay.innerHTML = '<p class="dining-error"><svg class="dining-error-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/><path d="M8 8l8 8M16 8l-8 8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>No menu dates available</span></p>';
            return;
          }

          const today = todayKey();
          if (!selectedDate || !availableDates.includes(selectedDate)) {
            selectedDate = availableDates.includes(today)
              ? today
              : availableDates[availableDates.length - 1];
            // A new day resets to that day's default, so a widget left open
            // overnight does not stay on yesterday's dinner.
            periodPinnedByUser = false;
          }

          // Follow the clock until the visitor picks a tab themselves; after
          // that their choice wins. Only the current day follows the clock, so
          // browsing yesterday still opens on breakfast.
          if (!periodPinnedByUser && selectedDate === today) {
            selectedPeriod = defaultPeriodForNow();
            syncPeriodTabs();
          }

          // Only rebuild the DOM when something visible actually changed, so a
          // background poll never makes the widget flicker.
          const nextKey = `${selectedDate}|${selectedPeriod}|${menuData.updatedAt || ''}`;
          if (nextKey !== renderedKey) {
            renderMenu({ allowPeriodFallback: true });
            catalogDishes();
          } else {
            renderDayPicker();
            updateRefreshInfo();
          }
          refreshRatings();
        } catch (error) {
          console.error('Menu load failed:', error);
          if (!menuData) {
            menuDisplay.innerHTML = '<p class="dining-error"><svg class="dining-error-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/><path d="M8 8l8 8M16 8l-8 8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>Failed to load menu</span></p>';
          }
        }
      }

      function scheduleMenuRefresh() {
        if (menuTimer) clearTimeout(menuTimer);
        menuTimer = setTimeout(loadMenu, MENU_POLL_MS);
      }

      function scheduleRatingsRefresh() {
        if (ratingsTimer) clearTimeout(ratingsTimer);
        ratingsTimer = setTimeout(async () => {
          if (document.visibilityState === 'visible' && !ratingsBusy) {
            ratingsBusy = true;
            try {
              await refreshRatings();
            } finally {
              ratingsBusy = false;
            }
          }
          scheduleRatingsRefresh();
        }, RATINGS_POLL_MS);
      }

      // Tab switching
      document.querySelectorAll('.dining-tab').forEach((button) => {
        button.addEventListener('click', () => {
          const nextPeriod = button.dataset.period;
          if (!nextPeriod || nextPeriod === selectedPeriod) return;
          periodPinnedByUser = true;
          selectedPeriod = nextPeriod;
          syncPeriodTabs();
          renderMenu();
          refreshRatings();
        });
      });

      // Come back to a visible tab and the data is refreshed at once.
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') {
          loadMenu();
          refreshRatings();
        }
      });
      window.addEventListener('focus', () => {
        loadMenu();
        refreshRatings();
      });
      window.addEventListener('online', loadMenu);

      loadMenu();
      scheduleMenuRefresh();
      scheduleRatingsRefresh();
      setInterval(updateRefreshInfo, 60000);

      // The site shows one pane at a time, picked by the tab bar. Both panes
      // stay in the DOM: the dashboard polls in the background and the widget
      // keeps its menu state, so switching tabs is instant and nothing refetches.
      // The embed has no tab bar, so it never takes this path.
      const menuPaneEl = document.querySelector('.menu-pane');
      const dashPaneEl = document.getElementById('dashPane');
      const topbarTabs = Array.prototype.slice.call(
        document.querySelectorAll('.topbar-tab')
      );

      function showView(view) {
        const isMenu = view !== 'dashboard';
        menuPaneEl.hidden = !isMenu;
        dashPaneEl.hidden = isMenu;
        topbarTabs.forEach((tab) => {
          const active = tab.dataset.view === (isMenu ? 'menu' : 'dashboard');
          tab.classList.toggle('active', active);
          tab.setAttribute('aria-selected', active ? 'true' : 'false');
        });
      }

      if (!document.body.classList.contains('embed')) {
        topbarTabs.forEach((tab) => {
          tab.addEventListener('click', () => showView(tab.dataset.view));
        });
        // A #dashboard hash (the embed's "View stats" link) opens the dashboard
        // tab; a #menu hash, or none, opens the widget.
        const openDashboard = () => showView(location.hash === '#dashboard' ? 'dashboard' : 'menu');
        openDashboard();
        window.addEventListener('hashchange', openDashboard);
      } else {
        // Inside the extension's iframe the dashboard pane is hidden, so the
        // link has to leave the frame. It points at the site root without the
        // extension's own host/session params, which would otherwise be carried
        // along and keep the new tab in embed mode.
        const statsLink = document.getElementById('viewStatsLink');
        if (statsLink) {
          statsLink.href = `${location.origin}${location.pathname}#dashboard`;
          statsLink.target = '_blank';
          statsLink.rel = 'noopener';
        }
      }

      // Drag the handle between the two panes to give the menu more or less
      // room. The widget column is driven by --menu-w so this only rewrites one
      // number; the choice is remembered between visits. The handle is
      // meaningless in the embed, where the layout is the widget alone.
      const splitterEl = document.getElementById('splitter');
      const MENU_W_KEY = 'hilltoppers-menu-width';
      const MIN_MENU_W = 260;
      const MIN_DASH_W = 320;

      function setMenuWidth(px) {
        const page = document.querySelector('.page');
        if (!page) return;
        const max = Math.max(MIN_MENU_W, page.clientWidth - MIN_DASH_W - 18);
        const width = Math.min(Math.max(px, MIN_MENU_W), max);
        document.documentElement.style.setProperty('--menu-w', `${width}px`);
        splitterEl.setAttribute('aria-valuenow', String(Math.round(width)));
        splitterEl.setAttribute('aria-valuemin', String(MIN_MENU_W));
        splitterEl.setAttribute('aria-valuemax', String(Math.round(max)));
        return width;
      }

      // The splitter is hidden on the site now that the panes are tabs, so its
      // saved width is stale: skip the restore while it is not displayed, and
      // the menu keeps the new default width instead of an old drag value.
      if (
        splitterEl &&
        !document.body.classList.contains('embed') &&
        !menuPaneEl.hidden &&
        getComputedStyle(splitterEl).display !== 'none'
      ) {
        try {
          const saved = Number(localStorage.getItem(MENU_W_KEY));
          if (saved) setMenuWidth(saved);
          else setMenuWidth(document.querySelector('.menu-pane').getBoundingClientRect().width);
        } catch (_) {
          setMenuWidth(600);
        }

        splitterEl.addEventListener('pointerdown', (event) => {
          event.preventDefault();
          splitterEl.setPointerCapture(event.pointerId);
          document.body.classList.add('splitter-active');
          const page = document.querySelector('.page');
          const left = page.getBoundingClientRect().left;
          const move = (e) => setMenuWidth(e.clientX - left);
          const up = (e) => {
            splitterEl.removeEventListener('pointermove', move);
            document.body.classList.remove('splitter-active');
            const width = e.clientX - left;
            try { localStorage.setItem(MENU_W_KEY, String(Math.round(width))); } catch (_) {}
          };
          splitterEl.addEventListener('pointermove', move);
          splitterEl.addEventListener('pointerup', up, { once: true });
        });

        // Keyboard users get the same control: arrows nudge, Home resets.
        splitterEl.addEventListener('keydown', (event) => {
          const page = document.querySelector('.page');
          const current = page.querySelector('.menu-pane').getBoundingClientRect().width;
          if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
            event.preventDefault();
            const next = setMenuWidth(current + (event.key === 'ArrowRight' ? 24 : -24));
            try { localStorage.setItem(MENU_W_KEY, String(Math.round(next))); } catch (_) {}
          } else if (event.key === 'Home') {
            event.preventDefault();
            setMenuWidth(600);
            try { localStorage.removeItem(MENU_W_KEY); } catch (_) {}
          }
        });
      }
    </script>
        </div>
      </div>
    </div>

    <script>
      // The dashboard runs in its own scope so its helper names cannot collide
      // with the widget's, which sits above it.
      (function () {

      // Same backend the menu widget writes to.
      const RATINGS_API = 'https://hilltoppers-menu-ratings.amos-donn.workers.dev';

      // One rating can put a dish at 5.0, so a ranking needs a few before the
      // average means anything. A single day rarely has that many, so Today is
      // ranked on the day's own ratings instead — see `split()`.
      const MIN_RATINGS = 3;

      const statusEl = document.getElementById('status');
      const cardsEl = document.getElementById('cards');
      const sidesEl = document.getElementById('sides');
      const rowsEl = document.getElementById('rows');
      const unrankedRowsEl = document.getElementById('unrankedRows');
      const rankedTitleEl = document.getElementById('rankedTitle');
      const unrankedTitleEl = document.getElementById('unrankedTitle');
      const rankedCountEl = document.getElementById('rankedCount');
      const unrankedCountEl = document.getElementById('unrankedCount');
      const footnoteEl = document.getElementById('footnote');
      const refreshBtn = document.getElementById('refresh');
      const scopeAllBtn = document.getElementById('scopeAll');
      const scopeTodayBtn = document.getElementById('scopeToday');
      // The dashboard pane lives under .dash, so scope the query to it: the
      // widget's own meal tabs also carry data-period and must not be caught.
      const periodBtns = [...document.querySelectorAll('.dash [data-period]')];
      const periodLabelEl = document.getElementById('periodLabel');
      const volumeEl = document.getElementById('volume');
      const volumeCountEl = document.getElementById('volumeCount');
      const volumeBtns = [...document.querySelectorAll('[data-vol-meal]')];
      const volumeCategoryEl = document.getElementById('volCategory');

      // The three meals, in the order the dining hall serves them. Used for
      // labels and for the per-meal cards; the Worker sends the same set.
      const PERIODS = ['breakfast', 'lunch', 'dinner'];
      const periodName = (p) => p.charAt(0).toUpperCase() + p.slice(1);

      const state = {
        scope: 'all',
        // '' means every meal; otherwise one of PERIODS.
        period: '',
        stats: null,
        dishes: { all: [], today: [] },
        expanded: new Set(),
        // Drill-down and side graphs are fetched once and kept until a refresh,
        // so reopening a row is instant.
        histories: new Map(),
        // The ratings-per-day volume graph keeps its own filters, independent of
        // the scope/meal pair above.
        volume: { meal: '', category: '', days: [], loaded: false, error: '' }
      };

      // The volume graph's category control lists every section a dish can be
      // catalogued under: the two daily stations and the four static sections.
      // Meals are a separate set of pins beside it.
      const CATEGORIES = ['Global Fare', 'Classic Kitchen', 'Soupside', 'Sauce + Stone', 'Greens', 'Sandwich'];

      // The two kitchens that change day to day, and so get a card of their own
      // on the dashboard.
      const DAILY_STATIONS = ['Classic Kitchen', 'Global Fare'];

      // The static section summarised in the left-hand card of that row. It is
      // a fixed section rather than a station, so it is catalogued and rated
      // under this exact name.
      const FEATURED_SECTION = 'Sauce + Stone';

      // The remaining static sections, which fill the second row of cards.
      // Derived from the menu's own section list so the two stay in step.
      const OTHER_SECTIONS = STATIC_SECTIONS
        .map((section) => section.key)
        .filter((key) => key !== FEATURED_SECTION);

      // The rating window has to be the day the hall is living in, not the UTC
      // day: at 8pm Eastern the UTC date has rolled over already.
      const localDate = () => new Date().toLocaleDateString('en-CA');
      const tzOffset = () => new Date().getTimezoneOffset();
      const scopeQuery = () => `date=${localDate()}&offset=${tzOffset()}`;

      function esc(value) {
        return String(value).replace(/[&<>"']/g, (c) => ({
          '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[c]));
      }

      function fmt(value) {
        return Number(value).toLocaleString('en-US');
      }

      function stars(average) {
        const filled = Math.round(average);
        let out = '';
        for (let i = 1; i <= 5; i += 1) {
          out += i <= filled ? '★' : '<span class="empty">★</span>';
        }
        return `<span class="stars" aria-label="${average} out of 5">${out}</span>`;
      }

      function card(value, label, extra) {
        return `<div class="card"><div class="value">${value}</div>${extra || ''}` +
          `<div class="label">${label}</div></div>`;
      }

      function pct(average) {
        return Math.round((average / 5) * 100);
      }

      // A history point's minute, in the reader's own clock. The API buckets in
      // the caller's timezone, so this only formats what it was handed.
      function fmtMinute(at) {
        return new Date(at).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
      }

      function fmtDay(day) {
        const [y, m, d] = String(day).split('-').map(Number);
        if (!y || !m || !d) return String(day);
        return new Date(y, m - 1, d).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
      }

      function fmtMoment(at) {
        return new Date(at).toLocaleString('en-US', {
          month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit'
        });
      }

      /**
       * A line chart of the running average, drawn as inline SVG so the page
       * keeps its no-dependency, iframe-safe promise.
       *
       * The y axis is pinned to 0–5 rather than stretched to the data, so two
       * charts can be compared at a glance; a dish that moved 3.0 → 3.2 should
       * not look as dramatic as one that moved 2.0 → 4.5.
       *
       * The x axis is the real time each rating landed, not the point's index.
       * Index spacing would draw an evening's three ratings and three ratings
       * spread over a month as the same shape; spacing by time means the line
       * leans where the rating was brisk and stretches where it was quiet. When
       * the points cross a day boundary the days are marked, because a long gap
       * and a short one otherwise look alike.
       *
       * The time is deliberately not written under each point. Once the buckets
       * are minutes, per-point labels overlap into an unreadable smear, so the
       * axis carries only the day (or the day range) and each point reveals its
       * exact instant in a grey tooltip on hover.
       */
      function chart(points) {
        if (!points.length) {
          return '<div class="chart"><div class="legend">No ratings yet.</div></div>';
        }
        const W = 320;
        const H = 108;
        const left = 22;
        const right = 10;
        const top = 10;
        const bottom = 18;
        const innerW = W - left - right;
        const innerH = H - top - bottom;

        // An older API buckets by day and sends no instant. Fall back to even
        // spacing rather than drawing every point at the same x.
        const timed = points.every((p) => Number.isFinite(p.at) && p.at > 0);
        const t0 = timed ? points[0].at : 0;
        const t1 = timed ? points[points.length - 1].at : 0;
        const span = t1 - t0;
        const x = (i) => {
          if (points.length === 1) return left + innerW / 2;
          if (!timed || span <= 0) return left + (i * innerW) / (points.length - 1);
          return left + ((points[i].at - t0) / span) * innerW;
        };
        const y = (v) => top + innerH - (Math.max(0, Math.min(5, v)) / 5) * innerH;

        const grid = [1, 3, 5]
          .map(
            (tick) =>
              `<line x1="${left}" y1="${y(tick)}" x2="${W - right}" y2="${y(tick)}" ` +
              `stroke="rgba(17,17,17,0.08)" stroke-width="1"/>` +
              `<text x="${left - 4}" y="${y(tick) + 3}" text-anchor="end" ` +
              `font-size="9" fill="#7d8591">${tick}</text>`
          )
          .join('');

        const path = points.map((p, i) => `${i ? 'L' : 'M'}${x(i)},${y(p.running)}`).join('');

        // The hover target is a full-height invisible band around each point, so
        // the tooltip is reachable without pixel-hunting the 2.6px dot. The
        // label is a grey box drawn in the SVG, positioned and filled in by the
        // hover handler below.
        const bands = points
          .map((p, i) => {
            const when = timed ? fmtMoment(p.at) : fmtDay(p.day);
            const label = `${when} · ${p.running} avg · ${p.count} rating${p.count === 1 ? '' : 's'}`;
            return (
              `<g class="point" data-x="${x(i)}" data-y="${y(p.running)}" ` +
              `data-label="${esc(label)}">` +
              `<rect x="${Math.max(0, x(i) - 6)}" y="${top}" width="12" height="${innerH}" fill="transparent"/>` +
              `<circle cx="${x(i)}" cy="${y(p.running)}" r="2.6" fill="#1a7f37"/>` +
              `</g>`
            );
          })
          .join('');

        // A marker where the date changes, so a gap of days is not read as a
        // gap of minutes.
        const days = [...new Set(points.map((p) => p.day))];
        const dayMarks =
          days.length > 1
            ? points
                .map((p, i) => ({ p, i }))
                .filter(({ p, i }) => i > 0 && p.day !== points[i - 1].day)
                .map(
                  ({ p, i }) =>
                    `<line x1="${x(i)}" y1="${top}" x2="${x(i)}" y2="${top + innerH}" ` +
                    `stroke="rgba(17,17,17,0.18)" stroke-width="1" stroke-dasharray="2 2"/>`
                )
                .join('')
            : '';

        // One quiet line naming the span, rather than a label per point.
        const dayLine =
          days.length === 1
            ? `<text x="${left}" y="${H - 3}" font-size="8.5" fill="#7d8591">${esc(fmtDay(days[0]))}</text>`
            : `<text x="${left}" y="${H - 3}" font-size="8.5" fill="#7d8591">` +
              `${esc(`${fmtDay(days[0])} – ${fmtDay(days[days.length - 1])}`)}</text>`;

        const total = points[points.length - 1].runningCount;
        const minutes = points.length;
        const legend =
          `Average over time · ${total} rating${total === 1 ? '' : 's'} across ` +
          `${minutes} minute${minutes === 1 ? '' : 's'}` +
          (days.length > 1 ? ` over ${days.length} days` : ` on ${fmtDay(days[0])}`) +
          ' · hover a point for its time';

        return `<div class="chart">
          <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Average rating over time">
            ${grid}
            ${dayMarks}
            <path d="${path}" fill="none" stroke="#1a7f37" stroke-width="2" stroke-linejoin="round"/>
            ${bands}
            <g class="chart-tip" hidden>
              <rect x="0" y="0" rx="3" ry="3" width="0" height="0" fill="#4b5563"/>
              <text x="0" y="0" font-size="8.5" fill="#ffffff" text-anchor="middle"> </text>
            </g>
          </svg>
          <div class="legend">${esc(legend)}</div>
        </div>`;
      }

      /**
       * Ratings per day as a histogram. One bar per day between the first and
       * last rated day, so the quiet days show as gaps rather than vanishing
       * and squeezing a weekend's silence out of the shape.
       *
       * Each bar reveals its exact date and count in the same grey tooltip the
       * line charts use.
       */
      function volumeChart(days) {
        if (!days.length) {
          return '<div class="legend">No ratings in range yet.</div>';
        }
        const W = 640;
        const H = 150;
        const left = 26;
        const right = 8;
        const top = 10;
        const bottom = 20;
        const innerW = W - left - right;
        const innerH = H - top - bottom;

        const max = Math.max(1, ...days.map((d) => d.count));
        // Four ticks up to the peak, so the axis stays readable at any height.
        const step = Math.max(1, Math.ceil(max / 4));
        const ticks = [];
        for (let v = 0; v <= max; v += step) ticks.push(v);
        if (ticks[ticks.length - 1] !== max) ticks.push(max);

        const slot = innerW / days.length;
        const barW = Math.max(1.5, Math.min(14, slot * 0.7));
        const y = (v) => top + innerH - (v / max) * innerH;

        const grid = ticks
          .map(
            (t) =>
              `<line x1="${left}" y1="${y(t)}" x2="${W - right}" y2="${y(t)}" ` +
              `stroke="rgba(17,17,17,0.08)" stroke-width="1"/>` +
              `<text x="${left - 4}" y="${y(t) + 3}" text-anchor="end" ` +
              `font-size="9" fill="#7d8591">${t}</text>`
          )
          .join('');

        const bars = days
          .map((d, i) => {
            const cx = left + slot * (i + 0.5);
            const h = d.count === 0 ? 0 : Math.max(1, innerH - (y(d.count) - top));
            return (
              `<g class="point" data-x="${cx}" data-y="${Math.max(top, y(d.count))}" ` +
              `data-label="${esc(`${fmtDay(d.day)} · ${d.count} rating${d.count === 1 ? '' : 's'}`)}">` +
              `<rect class="bar-hit" x="${cx - slot / 2}" y="${top}" width="${slot}" height="${innerH}"/>` +
              `<rect class="bar-fill" x="${cx - barW / 2}" y="${y(d.count)}" width="${barW}" height="${h}"/>` +
              `</g>`
            );
          })
          .join('');

        // Label only the ends, so a month of days does not smear the axis.
        const labelDays =
          days.length <= 6
            ? days.map((d, i) => ({ d, i }))
            : [{ d: days[0], i: 0 }, { d: days[days.length - 1], i: days.length - 1 }];
        const labels = labelDays
          .map(({ d, i }) => {
            const cx = left + slot * (i + 0.5);
            const anchor = i === 0 ? 'start' : i === days.length - 1 ? 'end' : 'middle';
            return (
              `<text x="${cx}" y="${H - 6}" text-anchor="${anchor}" font-size="8.5" fill="#7d8591">` +
              `${esc(fmtDay(d.day))}</text>`
            );
          })
          .join('');

        return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Ratings per day">
          ${grid}
          <g class="bars">${bars}</g>
          ${labels}
          <g class="chart-tip" hidden>
            <rect x="0" y="0" rx="3" ry="3" width="0" height="0" fill="#4b5563"/>
            <text x="0" y="0" font-size="8.5" fill="#ffffff" text-anchor="middle"> </text>
          </g>
        </svg>`;
      }

      /**
       * Places the grey tooltip inside the hovered SVG. Drawn in SVG rather
       * than as an HTML popover so it cannot be clipped by the panel, and sized
       * from the label length since SVG text cannot be measured synchronously.
       */
      function showTip(target) {
        const svg = target.closest('svg');
        const tip = svg && svg.querySelector('.chart-tip');
        if (!tip) return;
        const label = target.getAttribute('data-label') || '';
        const text = tip.querySelector('text');
        const box = tip.querySelector('rect');
        text.textContent = label;
        const w = label.length * 4.7 + 12;
        const h = 15;
        const cx = Number(target.getAttribute('data-x')) || 0;
        const cy = Number(target.getAttribute('data-y')) || 0;
        // Keep the box inside the viewBox rather than letting it run off an edge.
        const vb = svg.viewBox.baseVal;
        const x = Math.max(vb.x + w / 2 + 1, Math.min(vb.x + vb.width - w / 2 - 1, cx));
        const y = Math.max(vb.y + h + 2, cy - 8);
        box.setAttribute('x', x - w / 2);
        box.setAttribute('y', y - h);
        box.setAttribute('width', w);
        box.setAttribute('height', h);
        text.setAttribute('x', x);
        text.setAttribute('y', y - 4);
        tip.removeAttribute('hidden');
      }

      function hideTip(target) {
        const svg = target.closest('svg');
        const tip = svg && svg.querySelector('.chart-tip');
        if (tip) tip.setAttribute('hidden', '');
      }

      /**
       * Splits the current scope's dishes into "ranked" and "still gathering".
       *
       * All-time ranks on the lifetime average once a dish has MIN_RATINGS.
       * Today is a different question — one day rarely reaches three ratings —
       * so it ranks whatever was served today that anyone rated today, and
       * parks the dishes nobody rated in the waiting table. Both keep the same
       * two-table shape so the page reads the same in either scope.
       */
      function split(scope) {
        if (scope === 'today') {
          const served = state.dishes.today;
          return {
            ranked: served
              .filter((d) => d.count > 0 && d.average !== null)
              .sort((a, b) => b.average - a.average || b.count - a.count),
            unranked: served
              .filter((d) => !(d.count > 0 && d.average !== null))
              .sort((a, b) => a.name.localeCompare(b.name))
          };
        }
        const rated = state.dishes.all.filter((d) => d.count > 0 && d.average !== null);
        return {
          ranked: rated
            .filter((d) => d.count >= MIN_RATINGS)
            .sort((a, b) => b.average - a.average || b.count - a.count),
          unranked: rated
            .filter((d) => d.count < MIN_RATINGS)
            .sort((a, b) => b.count - a.count || b.average - a.average)
        };
      }

      function renderCards() {
        const stats = state.stats;
        const today = state.scope === 'today';
        // A Worker that predates the dual-scope fields answers without `today`;
        // fall back to zeroes rather than crashing the whole page while the two
        // deploys catch up with each other.
        const block = (today && stats.today) || (today ? { totalRatings: 0, ratedDishes: 0, raters: 0, ratingsPerRater: 0 } : stats);

        // When a meal is selected the cards describe that meal, so every figure
        // on the page belongs to one thing. The Worker sends a per-meal block
        // with the same fields; a Worker that predates it sends none, in which
        // case the page falls back to the overall figures rather than blanking.
        const meal = state.period ? findPeriod(state.period) : null;
        const mealBlock = meal ? (today && meal.today ? meal.today : meal) : null;
        const periodSuffix = state.period ? ` at ${periodName(state.period).toLowerCase()}` : '';

        const c = mealBlock
          ? {
              ratings: mealBlock.ratings,
              dishes: mealBlock.dishes,
              raters: mealBlock.raters,
              perRater: mealBlock.ratingsPerRater,
              average: mealBlock.average
            }
          : {
              ratings: block.totalRatings,
              dishes: block.ratedDishes,
              raters: block.raters,
              perRater: block.ratingsPerRater,
              average: block.average
            };

        const avg = c.average ? `${stars(c.average)} ${c.average}` : '—';
        cardsEl.innerHTML = [
          card(fmt(c.ratings), today ? `Ratings cast today${periodSuffix}` : `Ratings cast${periodSuffix}`),
          card(fmt(c.dishes), today ? `Dishes rated today${periodSuffix}` : `Dishes rated${periodSuffix}`),
          card(fmt(c.raters), today ? `Rater IDs today${periodSuffix}` : `Rater IDs${periodSuffix}`),
          card(fmt(c.perRater), 'Ratings per rater'),
          card(avg, 'Average rating')
        ].join('');
      }

      /** The Worker's per-meal block for one meal, or null on an older Worker. */
      function findPeriod(period) {
        const list = Array.isArray(state.stats?.periods) ? state.stats.periods : [];
        return list.find((p) => p.period === period) || null;
      }

      /**
       * The cards under the stat cards, in two rows: the daily kitchens and
       * one featured section on the first, then the remaining static sections
       * on the second.
       *
       * Every card reads alike — the same all-time / Today table, the same "—"
       * for a scope with no ratings, the same trend toggle — because they all
       * answer the same question. The kitchens and the featured section are
       * always rendered, even at zero, so the row keeps its shape instead of
       * shifting as ratings arrive; the second row follows the menu's own
       * section list.
       */
      function renderSides() {
        const stations = state.stats?.stations;
        // An older Worker sends no per-station breakdown at all. Fall back to
        // the empty message rather than drawing zeroed cards, which would read
        // as "nobody has rated anything" rather than "no data".
        if (!Array.isArray(stations)) {
          sidesEl.innerHTML =
            '<div class="side"><div class="side-head">Per side</div>' +
            '<div class="muted">No station data yet.</div></div>';
          return;
        }
        const byName = new Map(stations.map((s) => [s.station, s]));
        const card = (name) => sectionCard(name, byName.get(name) || emptyStation(name));
        sidesEl.innerHTML =
          card(FEATURED_SECTION) +
          DAILY_STATIONS.map((name) =>
            sideCard(`station:${name}`, name, byName.get(name) || emptyStation(name))
          ).join('') +
          OTHER_SECTIONS.map(card).join('');
      }

      /** The zero shape for a kitchen the Worker has not reported yet. */
      function emptyStation(name) {
        return {
          station: name,
          ratings: 0,
          raters: 0,
          average: 0,
          dishes: 0,
          today: { ratings: 0, raters: 0, average: 0, dishes: 0 }
        };
      }

      /**
       * The left-hand card: one static section's ratings, all-time and today.
       *
       * It reads exactly like a kitchen card — same table, same "—" for a
       * scope with no ratings, same trend toggle — because it answers the same
       * question for a fixed section that the kitchen cards answer for the two
       * daily ones. The only difference is the label: the section is not a
       * station, so it is titled "Sauce + Stone" rather than a kitchen name.
       */
      function sectionCard(name, block) {
        return sideCard(`station:${name}`, name, block || emptyStation(name));
      }

      /**
       * One side card: a label, a Trend toggle, and an All-time / Today table.
       * The two daily kitchens each get one, so they read alike.
       */
      function sideCard(key, label, all, todayBlock) {
        const today = todayBlock || { ratings: 0, raters: 0, average: 0 };
        const allValue = all.ratings === 0 ? '—' : all.average;
        const day = today.ratings === 0 ? '—' : today.average;
        const shown = state.expanded.has(key);
        return `<div class="side">
          <div class="side-head">
            <span>${esc(label)}</span>
            <button class="twist" type="button" data-graph="${esc(key)}"
              aria-expanded="${shown}">${shown ? 'Hide trend' : 'Trend'}</button>
          </div>
          <table>
            <thead>
              <tr><th>Scope</th><th class="num">Avg.</th><th class="num">Ratings</th><th class="num">Raters</th></tr>
            </thead>
            <tbody>
              <tr>
                <td>All-time</td>
                <td class="num">${allValue === '—' ? '—' : `${stars(all.average)} ${allValue}`}</td>
                <td class="num">${fmt(all.ratings)}</td>
                <td class="num">${fmt(all.raters)}</td>
              </tr>
              <tr>
                <td>Today</td>
                <td class="num">${day === '—' ? '—' : `${stars(today.average)} ${day}`}</td>
                <td class="num">${fmt(today.ratings)}</td>
                <td class="num">${fmt(today.raters)}</td>
              </tr>
            </tbody>
          </table>
          <div id="graph-${esc(key)}" data-graphslot="${esc(key)}"></div>
        </div>`;
      }

      /**
       * A dish row plus, when expanded, its drill-down: the rating-over-time
       * chart and the itemised list of every individual rating behind it.
       */
      function dishRow(d) {
        const expanded = state.expanded.has(d.id);
        const pctWidth = d.average === null ? 0 : pct(d.average);
        const value = d.average === null ? '—' : `${stars(d.average)} <span>${d.average}</span>`;
        const row = `<tr class="item" data-dish="${esc(d.id)}" aria-expanded="${expanded}">
          <td class="dish">${esc(d.name)}<div class="bar"><span style="width:${pctWidth}%"></span></div></td>
          <td class="num">${fmt(d.count)}</td>
          <td class="num">${value}</td>
          <td class="num"><button class="twist" type="button" data-dish="${esc(d.id)}"
            aria-label="${expanded ? 'Hide' : 'Show'} ratings for ${esc(d.name)}">${expanded ? 'Hide' : 'Details'}</button></td>
        </tr>`;
        if (!expanded) return row;
        return row + `<tr class="detail"><td colspan="4">
          <div class="detail-grid" id="detail-${esc(d.id)}" data-details="${esc(d.id)}">
            <div class="loading">Loading ratings…</div>
          </div>
        </td></tr>`;
      }

      function renderTables() {
        const { ranked, unranked } = split(state.scope);
        const today = state.scope === 'today';
        const periodSuffix = state.period ? ` · ${periodName(state.period)}` : '';

        rankedTitleEl.textContent = (today ? 'Today’s rankings' : 'Ranked') + periodSuffix;
        unrankedTitleEl.textContent = (today ? 'Served today, no ratings yet' : 'Still gathering ratings') + periodSuffix;

        rankedCountEl.textContent = ranked.length ? ` · ${fmt(ranked.length)}` : '';
        unrankedCountEl.textContent = unranked.length ? ` · ${fmt(unranked.length)}` : '';

        const emptyRanked = today
          ? state.todaySupported
            ? 'Nobody has rated anything served today yet.'
            : 'Waiting for the ratings backend to publish today’s data.'
          : `No dish has ${MIN_RATINGS} ratings yet.`;
        const emptyUnranked = today
          ? state.todaySupported
            ? 'Nothing served today.'
            : 'Waiting for the ratings backend to publish today’s data.'
          : 'Nothing waiting.';

        rowsEl.innerHTML = ranked.length
          ? ranked.map(dishRow).join('')
          : `<tr><td class="message" colspan="4">${emptyRanked}</td></tr>`;
        unrankedRowsEl.innerHTML = unranked.length
          ? unranked.map(dishRow).join('')
          : `<tr><td class="message" colspan="4">${emptyUnranked}</td></tr>`;
      }

      function render() {
        scopeAllBtn.setAttribute('aria-pressed', String(state.scope === 'all'));
        scopeTodayBtn.setAttribute('aria-pressed', String(state.scope === 'today'));
        periodBtns.forEach((btn) =>
          btn.setAttribute('aria-pressed', String(btn.getAttribute('data-period') === state.period))
        );
        periodLabelEl.textContent = state.period ? `${periodName(state.period)} only` : 'Meal';
        renderCards();
        renderSides();
        renderTables();
      }

      async function historyFor(key) {
        if (state.histories.has(key)) return state.histories.get(key);
        // Station and meal keys are prefixed ("station:Global Fare",
        // "period:dinner"); a dish key is the bare id. Dish ids are normalised
        // names, so they can contain spaces and every other character except a
        // colon — which the prefix owns.
        const isStation = key.startsWith('station:');
        const isPeriod = key.startsWith('period:');
        const value = isStation
          ? key.slice('station:'.length)
          : isPeriod
            ? key.slice('period:'.length)
            : key;
        const param = isStation
          ? `station=${encodeURIComponent(value)}`
          : isPeriod
            ? `period=${encodeURIComponent(value)}`
            : `dish=${encodeURIComponent(value)}`;
        const response = await fetch(
          `${RATINGS_API}/api/ratings/history?${param}&${scopeQuery()}`,
          { cache: 'no-store' }
        );
        if (!response.ok) throw new Error(`history returned ${response.status}`);
        const data = await response.json();
        state.histories.set(key, data);
        return data;
      }

      function detailBody(data) {
        const rows = data.ratings.length
          ? data.ratings
              .map(
                (r) => `<tr>
                  <td>${esc(new Date(r.updatedAt).toLocaleString('en-US'))}</td>
                  <td><code>${esc(r.rater)}</code></td>
                  <td class="rate-value">${stars(r.rating)} <span>${r.rating}</span></td>
                </tr>`
              )
              .join('')
          : `<tr><td class="message" colspan="3">No individual ratings.</td></tr>`;
        return `<div class="detail-grid">
          <div>
            <h3>Average over time</h3>
            ${chart(data.timeline)}
          </div>
          <div>
            <h3>Every rating · ${fmt(data.count)} total</h3>
            <div class="rating-list">
              <table>
                <thead><tr><th>When</th><th>Rater ID</th><th class="num">Rating</th></tr></thead>
                <tbody>${rows}</tbody>
              </table>
            </div>
          </div>
        </div>`;
      }

      /** Loads whatever the expanded rows and side graphs need, then paints. */
      async function hydrate() {
        const keys = [...state.expanded];
        for (const key of keys) {
          if (state.histories.has(key)) continue;
          try {
            await historyFor(key);
          } catch (error) {
            state.histories.set(key, { timeline: [], ratings: [], count: 0, average: 0, error: error.message });
          }
        }
        document.querySelectorAll('[data-details]').forEach((slot) => {
          const key = slot.getAttribute('data-details');
          const data = state.histories.get(key);
          slot.innerHTML = data && data.error
            ? `<div class="message error">Could not load ratings.<br>${esc(data.error)}</div>`
            : data
              ? detailBody(data)
              : '<div class="loading">Loading ratings…</div>';
        });
        document.querySelectorAll('[data-graphslot]').forEach((slot) => {
          const key = slot.getAttribute('data-graphslot');
          if (!state.expanded.has(key)) {
            slot.innerHTML = '';
            return;
          }
          const data = state.histories.get(key);
          if (data && data.error) {
            slot.innerHTML = `<div class="message error">Could not load the trend.<br>${esc(data.error)}</div>`;
          } else if (data) {
            slot.innerHTML = `<h3>Average over time</h3>${chart(data.timeline)}`;
          } else {
            slot.innerHTML = '<div class="loading">Loading trend…</div>';
          }
        });
      }

      // Row and button clicks both toggle a dish drill-down; the button stops
      // the row handler from firing twice.
      function toggleDish(id) {
        if (state.expanded.has(id)) state.expanded.delete(id);
        else state.expanded.add(id);
        renderTables();
        hydrate();
      }

      document.addEventListener('click', (event) => {
        const button = event.target.closest('button[data-dish]');
        if (button) {
          event.stopPropagation();
          toggleDish(button.getAttribute('data-dish'));
          return;
        }
        const graphButton = event.target.closest('button[data-graph]');
        if (graphButton) {
          const key = graphButton.getAttribute('data-graph');
          if (state.expanded.has(key)) state.expanded.delete(key);
          else state.expanded.add(key);
          renderSides();
          hydrate();
          return;
        }
        const row = event.target.closest('tr.item');
        if (row) toggleDish(row.getAttribute('data-dish'));
      });

      /** Fills the category picker once; the set is fixed. */
      function fillCategories() {
        volumeCategoryEl.innerHTML =
          '<option value="">All categories</option>' +
          CATEGORIES.map((c) => `<option value="${esc(c)}">${esc(c)}</option>`).join('');
        volumeCategoryEl.value = state.volume.category;
      }

      /**
       * Loads the ratings-per-day graph for the volume controls' own filters.
       * Meal and category are mutually exclusive: the API narrows by one, so
       * picking one clears the other rather than silently ignoring it.
       */
      async function loadVolume() {
        volumeEl.innerHTML = '<div class="loading">Loading…</div>';
        const query = [scopeQuery()];
        if (state.volume.meal) query.push(`period=${encodeURIComponent(state.volume.meal)}`);
        else if (state.volume.category) query.push(`category=${encodeURIComponent(state.volume.category)}`);
        try {
          const res = await fetch(`${RATINGS_API}/api/ratings/daily?${query.join('&')}`, { cache: 'no-store' });
          if (!res.ok) throw new Error(`daily returned ${res.status}`);
          const data = await res.json();
          state.volume.days = data.days || [];
          state.volume.error = '';
        } catch (error) {
          state.volume.days = [];
          state.volume.error = error.message;
        }
        renderVolume();
      }

      function renderVolume() {
        if (state.volume.error) {
          volumeEl.innerHTML =
            `<div class="message error">Could not load the daily graph.<br>${esc(state.volume.error)}</div>`;
          volumeCountEl.textContent = '';
          return;
        }
        const total = state.volume.days.reduce((sum, d) => sum + d.count, 0);
        volumeCountEl.textContent = total ? `${total} rating${total === 1 ? '' : 's'}` : '';
        volumeEl.innerHTML = volumeChart(state.volume.days);
      }

      function setScope(scope) {
        state.scope = scope;
        render();
        // Re-rendering rebuilds the expanded rows and side graph slots, so
        // whatever they need has to be painted again — cached history fills
        // instantly, anything new is fetched.
        hydrate();
      }

      /** Switching meal changes which dishes are on the page, so it refetches. */
      function setPeriod(period) {
        state.period = period;
        state.expanded.clear();
        state.histories.clear();
        load();
      }

      scopeAllBtn.addEventListener('click', () => setScope('all'));
      scopeTodayBtn.addEventListener('click', () => setScope('today'));
      periodBtns.forEach((btn) =>
        btn.addEventListener('click', () => setPeriod(btn.getAttribute('data-period')))
      );
      refreshBtn.addEventListener('click', async () => {
        state.histories.clear();
        await Promise.all([load(), loadVolume()]);
      });

      // The volume filters are independent of the scope/meal pair. Picking a
      // meal clears the category and vice versa, because the API narrows by one.
      volumeBtns.forEach((btn) =>
        btn.addEventListener('click', () => {
          state.volume.meal = btn.getAttribute('data-vol-meal') || '';
          if (state.volume.meal) state.volume.category = '';
          fillCategories();
          volumeBtns.forEach((b) =>
            b.setAttribute('aria-pressed', String((b.getAttribute('data-vol-meal') || '') === state.volume.meal))
          );
          loadVolume();
        })
      );
      volumeCategoryEl.addEventListener('change', () => {
        state.volume.category = volumeCategoryEl.value;
        if (state.volume.category) {
          state.volume.meal = '';
          volumeBtns.forEach((b) =>
            b.setAttribute('aria-pressed', String((b.getAttribute('data-vol-meal') || '') === ''))
          );
        }
        loadVolume();
      });

      // Grey tooltip on the line charts and the histogram. Delegated so it
      // survives every re-render.
      document.addEventListener('pointerover', (event) => {
        const target = event.target.closest('.point');
        if (target) showTip(target);
      });
      document.addEventListener('pointerout', (event) => {
        const target = event.target.closest('.point');
        // Moving between a point's own children is not leaving the point.
        if (target && !target.contains(event.relatedTarget)) hideTip(target);
      });

      async function load() {
        refreshBtn.disabled = true;
        statusEl.textContent = 'Loading…';
        const query = scopeQuery();
        // The all-time dish list honours the meal filter; the today list also
        // honours it (and narrows it to that day's meal, not any day's).
        const periodQuery = state.period ? `&period=${encodeURIComponent(state.period)}` : '';

        try {
          const [statsRes, allRes, todayRes] = await Promise.all([
            fetch(`${RATINGS_API}/api/stats?${query}`, { cache: 'no-store' }),
            fetch(`${RATINGS_API}/api/dishes?scope=all${periodQuery}`, { cache: 'no-store' }),
            fetch(`${RATINGS_API}/api/dishes?scope=today&${query}${periodQuery}`, { cache: 'no-store' })
          ]);
          if (!statsRes.ok) throw new Error(`stats returned ${statsRes.status}`);
          if (!allRes.ok) throw new Error(`dishes returned ${allRes.status}`);
          if (!todayRes.ok) throw new Error(`today dishes returned ${todayRes.status}`);

          state.stats = await statsRes.json();
          state.dishes.all = (await allRes.json()).dishes || [];
          const todayData = await todayRes.json();
          // A Worker that predates this feature ignores `scope=today` and
          // returns the whole catalogue. Rendering that as "served today" would
          // be actively wrong, so treat a missing marker as "no today data"
          // until the two deploys catch up.
          state.todaySupported = todayData.scope === 'today';
          state.dishes.today = state.todaySupported ? todayData.dishes || [] : [];

          render();
          await hydrate();

          footnoteEl.innerHTML =
            `${fmt(state.stats.catalogue)} dishes in the catalogue, including ones nobody has rated. ` +
            'A "rater ID" is a random value stored per browser, so it counts browsers rather than people — ' +
            'clearing site data or rating from a second device adds another. ' +
            'Today is the local day with a ' +
            `${tzOffset()} minute UTC offset, and only counts ratings cast that day.`;
          statusEl.textContent = `Updated ${new Date().toLocaleTimeString('en-US')}`;
        } catch (error) {
          cardsEl.innerHTML = '';
          sidesEl.innerHTML = '';
          rowsEl.innerHTML =
            `<tr><td class="message error" colspan="4">Could not reach the ratings API.<br>${esc(error.message)}</td></tr>`;
          unrankedRowsEl.innerHTML = '';
          rankedCountEl.textContent = '';
          unrankedCountEl.textContent = '';
          footnoteEl.textContent = '';
          statusEl.textContent = 'Failed to load.';
        } finally {
          refreshBtn.disabled = false;
        }
      }

      fillCategories();
      load();
      loadVolume();
    
      })();
    </script>
    <script src="./resize.js" defer></script>
  </body>
</html>
