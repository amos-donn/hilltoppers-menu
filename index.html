<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Hilltoppers Menu</title>
    <link rel="icon" type="image/png" href="./logo.png" />
    <link rel="apple-touch-icon" href="./logo.png" />
    <style>
      :root {
        --bg: #f7f8fb;
        --panel: #ffffff;
        --panel-alt: #fbfcff;
        --text-primary: #161b22;
        --text-muted: #7d8591;
        --green: #1a7f37;
        --green-bg: rgba(26, 127, 55, 0.12);
        --green-ring: rgba(26, 127, 55, 0.25);
        --star: #e3a008;
      }

      * {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        padding: 0;
        /* Let the page shrink as well as grow when embedded with "Fit content".
           A min-height or fixed height here would stop the iframe contracting. */
        min-height: 0;
        background: var(--panel);
        color: var(--text-primary);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 13px;
        line-height: 1.5;
      }

      body {
        padding: 12px;
      }

      /* Natural-height wrapper measured by resize.js. flow-root stops margins
         from collapsing through it, which would under-report the height. */
      [data-topping-content] {
        display: flow-root;
      }

      .popup {
        max-width: 360px;
        margin: 0 auto;
      }

      .section {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .dining-content {
        border-radius: 8px;
        background: var(--panel);
        padding: 12px;
      }

      .dining-tabs {
        display: flex;
        align-items: center;
        border: 1px solid rgba(17, 17, 17, 0.14);
        border-radius: 999px;
        background: #fbfcff;
        padding: 2px;
        overflow: hidden;
        margin-bottom: 10px;
        gap: 0;
      }

      .dining-tab {
        flex: 1 1 0;
        border: none;
        border-radius: 999px;
        background: transparent;
        color: #555f6a;
        font-size: 12px;
        font-weight: 600;
        padding: 5px 6px;
        cursor: pointer;
        transition: background 0.2s ease, color 0.2s ease;
      }

      .dining-tab:hover:not(.active) {
        background: rgba(17, 17, 17, 0.06);
        color: #2f3842;
      }

      .dining-tab.active {
        background: var(--green-bg);
        color: #1f6f2b;
        box-shadow: 0 0 0 1px var(--green-ring) inset;
      }

      /* Always two columns: Global Fare and Classic Kitchen sit side by side,
         including inside a narrow iframe. */
      .dining-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
        margin-bottom: 8px;
      }

      /* Separates the daily stations from the four sections below, which are
         the same every day. */
      .dining-divider {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 14px 0 6px;
        color: var(--text-muted);
      }

      .dining-divider::before,
      .dining-divider::after {
        content: '';
        flex: 1 1 auto;
        height: 1px;
        background: rgba(17, 17, 17, 0.14);
      }

      .dining-divider-label {
        flex: 0 0 auto;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        text-align: center;
      }

      .dining-note {
        margin: 0 0 8px;
        font-size: 11px;
        line-height: 1.4;
        color: var(--text-muted);
        text-align: center;
      }

      .dining-column {
        border: 1px solid rgba(17, 17, 17, 0.1);
        border-radius: 6px;
        padding: 8px;
        background: #fbfcff;
        min-width: 0;
      }

      .dining-station {
        margin: 0 0 4px;
        font-size: 11px;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--text-muted);
        font-weight: 700;
      }

      .dining-item {
        margin: 0;
        padding: 6px 0;
        border-bottom: 1px solid rgba(17, 17, 17, 0.1);
        font-size: 13px;
        color: #161b22;
        font-weight: 600;
        line-height: 1.35;
      }

      .dining-item:first-of-type {
        padding-top: 0;
      }

      .dining-item:last-child {
        border-bottom: none;
        padding-bottom: 0;
      }

      .dining-item-name {
        color: #161b22;
        text-decoration: none;
        display: block;
        transition: color 0.15s ease;
      }

      .dining-item-name:hover {
        color: var(--green);
      }

      /* The inline stars are a read-only summary of the dish's average; the
         whole row is the button that opens the rating dialog. */
      .dish-rating {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 4px 6px;
        margin-top: 3px;
        padding: 3px 6px 3px 3px;
        border: 1px solid transparent;
        border-radius: 6px;
        background: none;
        font: inherit;
        font-weight: 500;
        color: inherit;
        text-align: left;
        cursor: pointer;
        min-width: 0;
        transition: background 0.15s ease, border-color 0.15s ease;
      }

      .dish-rating:hover,
      .dish-rating:focus-visible {
        background: rgba(17, 17, 17, 0.05);
        border-color: rgba(17, 17, 17, 0.12);
        outline: none;
      }

      .stars {
        display: inline-flex;
        align-items: center;
        gap: 1px;
        flex: 0 0 auto;
      }

      .star {
        padding: 1px;
        color: rgba(17, 17, 17, 0.22);
        line-height: 0;
      }

      .star svg {
        width: 13px;
        height: 13px;
        display: block;
        fill: currentColor;
      }

      .star.filled {
        color: var(--star);
      }

      .rating-summary {
        font-size: 11px;
        color: var(--text-muted);
        font-weight: 600;
        white-space: nowrap;
        min-width: 0;
        overflow-wrap: anywhere;
      }

      .rating-dialog {
        border: none;
        border-radius: 12px;
        padding: 0;
        width: min(300px, calc(100vw - 32px));
        box-shadow: 0 14px 34px rgba(17, 17, 17, 0.28);
        color: var(--text-primary);
      }

      .rating-dialog::backdrop {
        background: rgba(17, 17, 17, 0.45);
      }

      .rating-dialog-form {
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 16px;
      }

      .rating-dialog-title {
        margin: 0;
        font-size: 14px;
        font-weight: 700;
      }

      .rating-dialog-dish {
        margin: -8px 0 0;
        font-size: 13px;
        font-weight: 600;
        color: #2f3842;
      }

      .rating-dialog-stars {
        display: flex;
        justify-content: center;
        gap: 6px;
      }

      .rating-dialog-star {
        border: none;
        background: none;
        padding: 2px;
        cursor: pointer;
        color: rgba(17, 17, 17, 0.22);
        line-height: 0;
        border-radius: 50%;
        transition: transform 0.1s ease, color 0.15s ease;
      }

      .rating-dialog-star svg {
        width: 26px;
        height: 26px;
        display: block;
        fill: currentColor;
      }

      .rating-dialog-star:hover,
      .rating-dialog-star:focus-visible {
        transform: scale(1.12);
        outline: none;
      }

      .rating-dialog-star.active {
        color: var(--star);
      }

      .rating-dialog-hint {
        margin: 0;
        min-height: 16px;
        text-align: center;
        font-size: 12px;
        color: var(--text-muted);
      }

      .rating-dialog-actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
      }

      .rating-dialog-button {
        border: 1px solid rgba(17, 17, 17, 0.18);
        border-radius: 8px;
        background: #ffffff;
        color: #2f3842;
        font-size: 12px;
        font-weight: 600;
        padding: 7px 14px;
        cursor: pointer;
        transition: background 0.15s ease, opacity 0.15s ease;
      }

      .rating-dialog-button:hover:not(:disabled) {
        background: #f2f4f8;
      }

      .rating-dialog-button.primary {
        border-color: transparent;
        background: var(--green);
        color: #ffffff;
      }

      .rating-dialog-button.primary:hover:not(:disabled) {
        background: #15692c;
      }

      /* Delete sits apart from the dismiss/save pair: it destroys a rating
         rather than committing one. */
      .rating-dialog-button.danger {
        margin-right: auto;
        border-color: rgba(180, 35, 24, 0.28);
        color: #b42318;
      }

      .rating-dialog-button.danger:hover:not(:disabled) {
        background: rgba(180, 35, 24, 0.08);
      }

      .rating-dialog-button:disabled {
        opacity: 0.5;
        cursor: default;
      }

      .dining-meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin: 8px 0 0;
        font-size: 12px;
        color: var(--text-muted);
      }

      .dining-link {
        color: var(--green);
        text-decoration: none;
        font-weight: 600;
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }

      .dining-link:hover {
        text-decoration: underline;
      }

      .dining-link-icon {
        width: 14px;
        height: 14px;
        flex: 0 0 auto;
      }

      .menu-day-picker {
        display: inline-flex;
        align-items: center;
        gap: 2px;
      }

      .menu-day-step {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: none;
        background: transparent;
        padding: 4px;
        border-radius: 4px;
        cursor: pointer;
        transition: background 0.15s ease;
        color: var(--text-muted);
        font-size: 14px;
      }

      .menu-day-step:hover:not(:disabled) {
        background: rgba(17, 17, 17, 0.06);
      }

      .menu-day-step:disabled {
        cursor: default;
        opacity: 0.3;
      }

      .menu-day-label {
        min-width: 58px;
        text-align: center;
        font-weight: 600;
        color: #2f3842;
        font-size: 12px;
      }

      .dining-loading {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        margin: 0;
        font-size: 13px;
        color: var(--text-muted);
      }

      .dining-spinner {
        width: 14px;
        height: 14px;
        flex: 0 0 auto;
        border: 2px solid rgba(26, 127, 55, 0.2);
        border-top-color: var(--green);
        border-radius: 50%;
        animation: spin 0.75s linear infinite;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      .dining-error {
        margin: 0;
        font-size: 13px;
        color: #d1242f;
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }

      .dining-error-icon {
        width: 14px;
        height: 14px;
        flex: 0 0 auto;
      }

      .refresh-info {
        font-size: 11px;
        color: var(--text-muted);
        text-align: center;
        margin-top: 6px;
      }

      .refresh-link {
        color: var(--green);
        margin-left: 6px;
        text-decoration: none;
      }

      /* The stats link is the embedded widget's way through to the dashboard.
         On the site the tab bar already does that, so the link would be a
         second, redundant route to the same pane. */
      body.combined:not(.embed) .refresh-link {
        display: none;
      }

      .refresh-link:hover {
        text-decoration: underline;
      }

      @media (max-width: 420px) {
        /* Inside a narrow iframe the card is the whole surface, so let it reach
           the container edges the way the extension's own menu does. */
        body {
          padding: 0;
        }
      }

      /* Combined site: the widget on the left, the ratings dashboard on the
         right. The widget's own rules above are untouched so the embedded
         iframe renders byte-for-byte the same; only this wrapper is new. */
      body.combined:not(.embed) {
        background: var(--bg, #f7f8fb);
      }

      /* Site chrome: the Menu/Dashboard tab bar and the project mark. Both
         belong to the combined site only — the embed is the widget alone — so
         these rules are scoped away from body.embed. */
      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
        margin-bottom: 14px;
      }

      .topbar-tabs {
        display: inline-flex;
        align-items: center;
        border: 1px solid rgba(17, 17, 17, 0.14);
        border-radius: 999px;
        background: #fbfcff;
        padding: 3px;
      }

      .topbar-tab {
        border: none;
        border-radius: 999px;
        background: transparent;
        color: #555f6a;
        font: inherit;
        font-size: 13px;
        font-weight: 600;
        padding: 7px 18px;
        cursor: pointer;
        transition: background 0.2s ease, color 0.2s ease;
      }

      .topbar-tab:hover {
        color: #2f3842;
      }

      .topbar-tab.active {
        background: var(--green-bg);
        color: #1f6f2b;
        box-shadow: 0 0 0 1px var(--green-ring) inset;
      }

      .topbar-brand {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 3px;
      }

      .topbar-brand-row {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .topbar-logo {
        width: 28px;
        height: 28px;
        display: block;
        border-radius: 7px;
      }

      .topbar-title {
        font-size: 15px;
        font-weight: 700;
        color: #161b22;
      }

      .topbar-tagline {
        font-size: 11px;
        color: var(--text-muted);
      }

      body.embed .topbar {
        display: none;
      }

      /* The site shows one pane at a time and the tab bar picks which. The
         embed never sees the tab bar, so it always keeps the widget alone. */
      .page {
        position: relative;
        max-width: 1500px;
        margin: 0 auto;
        padding: 16px;
      }

      /* On the site the menu tab is the widget alone, so it is centred in the
         page and given a little more room than the narrow embed card. The
         embed keeps the widget's own 360px measure, so the iframe is byte-for-
         byte the same as before. */
      body.combined:not(.embed) .menu-pane {
        max-width: var(--menu-w, 600px);
        margin: 0 auto;
      }

      body.combined:not(.embed) .popup {
        max-width: none;
      }

      /* The site's menu tab fits the whole menu on one screen: the wider
         measure puts the four static sections on a single line, and the chrome
         around them is trimmed to the minimum. Every rule is scoped to the
         site so the embedded widget keeps its own spacing and stays byte-for-
         byte the same. */
      body.combined:not(.embed) {
        padding: 4px 12px;
      }

      body.combined:not(.embed) .page {
        padding: 4px 12px 6px;
      }

      body.combined:not(.embed) .topbar {
        margin-bottom: 5px;
      }

      body.combined:not(.embed) .topbar-logo {
        width: 24px;
        height: 24px;
      }

      body.combined:not(.embed) .dining-content {
        padding: 6px;
      }

      body.combined:not(.embed) .dining-tabs {
        margin-bottom: 5px;
      }

      body.combined:not(.embed) .dining-tab {
        padding: 4px 6px;
      }

      body.combined:not(.embed) .dining-grid {
        gap: 6px;
        margin-bottom: 5px;
      }

      /* Four sections across rather than two, so the static half of the menu
         costs one row instead of two. */
      body.combined:not(.embed) .dining-grid-static {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }

      body.combined:not(.embed) .dining-column {
        padding: 5px 8px;
      }

      body.combined:not(.embed) .dining-item {
        padding: 2px 0;
      }

      body.combined:not(.embed) .dish-rating {
        margin-top: 0;
        padding: 0 6px 0 3px;
      }

      body.combined:not(.embed) .dining-divider {
        margin: 5px 0 2px;
      }

      body.combined:not(.embed) .dining-note {
        margin-bottom: 2px;
      }

      body.combined:not(.embed) .refresh-info {
        margin-top: 3px;
      }

      .menu-pane[hidden],
      .dash-pane[hidden] {
        display: none;
      }

      /* Tabs replace the side-by-side layout, so there is no boundary left for
         the drag handle to sit on. */
      body.combined:not(.embed) .splitter {
        display: none;
      }

      /* Embedded in the Hilltoppers extension the page is the widget alone, so
         the dashboard pane is hidden. The wrapper class is set from the
         extension's own host/session params, which is the same signal
         resize.js keys off. */
      body.embed .page {
        display: block;
        max-width: none;
        padding: 0;
      }

      body.embed .dash-pane {
        display: none;
      }

      .dash-pane {
        min-width: 0;
      }

      /* The dashboard's own stylesheet, scoped under .dash. Its :root tokens
         that the widget does not define are scoped here so the widget's own
         rules stay untouched. */
      .dash {
        --border: rgba(17, 17, 17, 0.14);
        --line: rgba(17, 17, 17, 0.07);
      }

      /* The wrapper carries both classes on one element, so this is a
         compound selector, not a descendant one. */
      .dash.wrap {
        max-width: 820px;
        margin: 0 auto;
        padding: 24px 16px 48px;
      }

      /* On the site the dashboard owns the page, so it fills the measure
         instead of centring a narrow column. */
      body.combined:not(.embed) .dash.wrap {
        max-width: none;
        margin: 0;
        padding: 0 4px 48px;
      }

      /* A drag handle between the two panes. Unused while the tabs show one
         pane at a time, but kept for the layout's history and the keyboard
         affordances it carries. */
      .splitter {
        position: absolute;
        top: 0;
        bottom: 0;
        left: calc(var(--menu-w, 440px) + 16px);
        width: 10px;
        margin-left: -5px;
        cursor: col-resize;
        z-index: 5;
      }

      body.embed .splitter { display: none; }

      .splitter::before {
        content: '';
        position: absolute;
        top: 0;
        bottom: 0;
        left: 4px;
        width: 2px;
        background: transparent;
        transition: background 120ms ease;
      }

      .splitter:hover::before,
      .splitter:focus-visible::before,
      body.splitter-active .splitter::before {
        background: var(--green, #2f7d4f);
      }

      .dash header {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 14px;
      }

      .dash h1 {
        font-size: 18px;
        margin: 0;
      }

      .dash .subtitle {
        color: var(--text-muted);
        font-size: 12px;
        margin-top: 2px;
      }

      .dash .refresh {
        border: 1px solid var(--border);
        border-radius: 999px;
        background: var(--green);
        color: #ffffff;
        padding: 7px 16px;
        font: inherit;
        font-size: 13px;
        cursor: pointer;
        transition: background 0.15s ease, opacity 0.15s ease;
      }

      .dash .refresh:hover:not(:disabled) {
        background: #15692c;
      }

      .dash .refresh:disabled {
        opacity: 0.6;
        cursor: default;
      }

      /* Scope toggle: All-time vs Today drives every panel below it. */
      .dash .scopes {
        display: inline-flex;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: var(--panel);
        padding: 3px;
        margin-bottom: 16px;
      }

      .dash .scopes button {
        border: 0;
        background: transparent;
        font: inherit;
        font-size: 13px;
        padding: 5px 16px;
        border-radius: 999px;
        cursor: pointer;
        color: var(--text-muted);
      }

      .dash .scopes button[aria-pressed='true'] {
        background: var(--green);
        color: #ffffff;
      }

      /* Period filter: All / Breakfast / Lunch / Dinner. A second row of the
         same pill control, so the two filters read as one pair. */
      .dash .filters {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        margin-bottom: 16px;
      }

      .dash .filters .scopes {
        margin-bottom: 0;
      }

      .dash .filters .label {
        font-size: 12px;
        color: var(--text-muted);
        margin-right: 2px;
      }

      .dash .cards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 10px;
        margin-bottom: 18px;
      }

      .dash .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 14px;
      }

      .dash .card .value {
        font-size: 24px;
        font-weight: 600;
        line-height: 1.2;
      }

      .dash .card .label {
        color: var(--text-muted);
        font-size: 12px;
        margin-top: 2px;
      }

      .dash .card .stars {
        display: block;
        font-size: 14px;
        margin-top: 2px;
      }

      .dash .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        overflow: hidden;
        margin-bottom: 14px;
      }

      .dash .panel-title {
        padding: 9px 14px;
        background: var(--panel-alt);
        border-bottom: 1px solid var(--line);
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.02em;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      .dash .panel-title .count {
        color: var(--text-muted);
        font-weight: 400;
      }

      /* Three cards per row: the two daily kitchens with a static section, and
         then the remaining sections. Fixed columns rather than auto-fit:
         auto-fit packs as many as fit onto one row on a wide screen, and the
         row would then read as one flat run instead of "the two kitchens, plus
         a section". The second row is left-aligned rather than stretched, so
         its shorter run of cards keeps the same width as the first. */
      .dash .sides {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
        margin-bottom: 16px;
      }

      @media (max-width: 720px) {
        .dash .sides {
          grid-template-columns: 1fr;
        }
      }

      .dash .side {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 12px 14px;
      }

      .dash .side-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        font-size: 13px;
        font-weight: 600;
        margin-bottom: 8px;
      }

      .dash .side table {
        border-collapse: collapse;
        width: 100%;
      }

      .dash .side th,
      .dash .side td {
        padding: 5px 0;
        border: 0;
        font-size: 13px;
      }
