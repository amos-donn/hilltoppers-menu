name: Update menu

# The menu must reach visitors as soon as it is posted, so this runs on the
# shortest interval GitHub reliably honours. GitHub's own scheduler can lag by
# several minutes under load, so the job also re-runs on a schedule external
# callers can trigger (workflow_dispatch) and commits only when the menu changed.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/fetch-menu.mjs'
      - '.github/workflows/update-menu.yml'

permissions:
  contents: write

concurrency:
  group: update-menu
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Install dependencies
        working-directory: scripts
        run: npm ci

      - name: Fetch the menu
        run: node scripts/fetch-menu.mjs

      - name: Commit when the menu changed
        run: |
          if git diff --quiet -- menu.json; then
            echo "No menu change to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add menu.json
          git commit -m "Update menu data"
          git push
